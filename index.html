<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dark Hero Transformation</title><style>
*{box-sizing:border-box}body{margin:0;background:#050712;color:#dce9ff;font-family:system-ui,Arial;display:grid;place-items:center;min-height:100vh}.app{width:min(94vw,530px);padding:18px;text-align:center}h1{font-size:1.4rem;letter-spacing:.17em;text-transform:uppercase}.scene{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;border:1px solid #42506b;border-radius:18px;background:linear-gradient(#090e24,#192b40 65%,#05070c);box-shadow:0 0 55px #192b5d}.moon{position:absolute;right:12%;top:9%;width:95px;aspect-ratio:1;border-radius:50%;background:#b9d5ed;box-shadow:0 0 60px #b5d8f5aa}.skyline{position:absolute;inset:35% 0 0;background:repeating-linear-gradient(90deg,#080d17 0 24px,#121b2a 24px 34px,#060a13 34px 65px);clip-path:polygon(0 35%,8% 35%,8% 12%,17% 12%,17% 31%,26% 31%,26% 2%,35% 2%,35% 30%,44% 30%,44% 16%,56% 16%,56% 40%,66% 40%,66% 0,77% 0,77% 24%,87% 24%,87% 10%,100% 10%,100% 100%,0 100%)}.photo{position:absolute;inset:0;background:url('original.jpg') center 36%/cover no-repeat;filter:grayscale(.8) brightness(.66) contrast(1.4);mix-blend-mode:screen;opacity:.83}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#03071388,transparent 40%,#05071599),linear-gradient(0deg,#050715c9,transparent 42%);pointer-events:none}.armor{position:absolute;left:19%;top:25%;width:62%;height:50%;border-radius:38% 38% 18% 18%;background:linear-gradient(100deg,#04070b 5%,var(--armor) 42%,#05080e 75%);clip-path:polygon(27% 0,73% 0,100% 22%,87% 100%,14% 100%,0 22%);opacity:.72;mix-blend-mode:multiply;transition:background .35s}.emblem{position:absolute;left:43%;top:39%;width:14%;height:5%;border:2px solid var(--glow);border-radius:50% 50% 20% 20%;box-shadow:0 0 24px var(--glow);opacity:.85}.cape{position:absolute;top:31%;left:13%;width:74%;height:62%;border-left:15px solid var(--glow);border-right:15px solid var(--glow);filter:blur(8px);opacity:.28;animation:pulse 2s infinite alternate}.rain{position:absolute;inset:-100%;background:repeating-linear-gradient(110deg,transparent 0 23px,#d4e6ff44 24px,transparent 25px 45px);animation:rain .6s linear infinite;opacity:.32;pointer-events:none}.label{position:absolute;bottom:20px;left:0;right:0;text-shadow:0 0 12px black;font-weight:800;letter-spacing:.18em;font-size:1.2rem}.flash{position:absolute;inset:0;background:var(--glow);opacity:0;pointer-events:none}.flash.on{animation:flash .45s ease-out}.scene{--armor:#171e2c;--glow:#3e9dff}@keyframes rain{to{transform:translate(30px,100px)}}@keyframes pulse{to{opacity:.55;filter:blur(15px)}}@keyframes flash{20%{opacity:.36}100%{opacity:0}}button{margin:15px 5px;padding:11px 19px;border:1px solid #5a77aa;border-radius:9px;background:#18253e;color:white;cursor:pointer}p{color:#a8b9d4;font-size:.86rem;line-height:1.5}</style></head><body><main class="app"><h1>Dark Hero // Transformation</h1><div class="scene" id="scene"><div class="moon"></div><div class="skyline"></div><div class="photo"></div><div class="armor"></div><div class="cape"></div><div class="emblem"></div><div class="shade"></div><div class="rain"></div><div class="flash" id="flash"></div><div class="label" id="label">SHADOW KNIGHT</div></div><button id="toggle">Pause</button><button id="next">Next suit</button><p>Costume-inspired animated color overlays switch every second. This is a stylized photo effect, not AI clothing replacement.</p></main><script>
const suits=[['SHADOW KNIGHT','#131c2b','#4a9bff'],['NIGHT PHANTOM','#090b13','#a36cff'],['DARK SENTINEL','#202328','#e03b5a'],['NEON VIGILANTE','#10272c','#17e7d4'],['MIDNIGHT ARMOR','#24252c','#f1c56b']];let index=0,playing=true;const scene=document.getElementById('scene'),label=document.getElementById('label'),flash=document.getElementById('flash');function change(){index=(index+1)%suits.length;const [name,armor,glow]=suits[index];scene.style.setProperty('--armor',armor);scene.style.setProperty('--glow',glow);label.textContent=name;flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on')}let timer=setInterval(change,1000);document.getElementById('toggle').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause':'Play';if(playing)timer=setInterval(change,1000);else clearInterval(timer)};document.getElementById('next').onclick=change;
</script></body></html>
